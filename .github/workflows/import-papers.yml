name: Import papers to Zotero
on:
  push:
    branches: [paper-queue]
    paths: ["queue/**", "placements/**", "import_papers.py", "reading-order.json", "paper-facts.json", "paper-questions.json", "to-inbox.json", "add-topics.json"]
  schedule:
    - cron: "43 23 * * 0"  # Sundays 4:43 PM in Calgary, two hours before the weekly search: file the Inbox, tag manual entries, renumber, list papers to place
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-papers
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests
      - run: python import_papers.py
        env:
          ZOTERO_USER_ID: ${{ secrets.ZOTERO_USER_ID }}
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
      - name: Record what was imported
        if: always()
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git config user.name "paper-importer"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Record imported papers"
          git pull --rebase origin paper-queue
          git push origin HEAD:paper-queue
