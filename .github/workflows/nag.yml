name: Nag
on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 min (GitHub may run it a few minutes late)
  workflow_dispatch: {}      # "Run workflow" button for a manual test
concurrency:
  group: nag
  cancel-in-progress: false
jobs:
  nag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet requests tzdata
      - run: python nag.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE: ${{ secrets.NOTION_PARENT_PAGE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          APP_URL: ${{ secrets.APP_URL }}
          DOD_TZ: America/Edmonton
          QUIET_HOURS: "23-7"
