name: Keep awake
on:
  schedule:
    - cron: "23 */3 * * *"   # every 3 h: Streamlit Cloud sleeps an app after ~12 h without a visit
  workflow_dispatch: {}
concurrency:
  group: keep-awake
  cancel-in-progress: true
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet playwright && python -m playwright install --with-deps chromium
      - run: python keep_awake.py
        env:
          APP_URL: ${{ secrets.APP_URL }}
