<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;padding:0;background:transparent}</style></head>
<body>
<script>
// Remembers this device for Deadline or Die: stores the login key in a cookie (read by the server on the next visit)
// and localStorage (backup), and reports what it has. Invisible.
const NAME = "dod_k", YEAR = 60 * 60 * 24 * 400;
const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*");
const readCookie = () => (document.cookie.split("; ").find(c => c.startsWith(NAME + "=")) || "").slice(NAME.length + 1);
let last = null;
window.addEventListener("message", ev => {
  const d = ev.data || {};
  if (d.type !== "streamlit:render") return;
  const a = d.args || {};
  try {
    if (a.set && /^[0-9a-f]{8,64}$/.test(a.set)) {
      document.cookie = `${NAME}=${a.set}; max-age=${YEAR}; path=/; SameSite=Lax; Secure`;
      try { localStorage.setItem(NAME, a.set); } catch (e) {}
    }
    if (a.clear) {
      document.cookie = `${NAME}=; max-age=0; path=/; SameSite=Lax; Secure`;
      try { localStorage.removeItem(NAME); } catch (e) {}
    }
  } catch (e) {}
  let v = "";
  try { v = localStorage.getItem(NAME) || ""; } catch (e) {}
  v = v || readCookie();
  if (v && !readCookie()) document.cookie = `${NAME}=${v}; max-age=${YEAR}; path=/; SameSite=Lax; Secure`;  // heal
  if (v !== last) { last = v; send("streamlit:setComponentValue", {value: v, dataType: "json"}); }
});
send("streamlit:componentReady", {apiVersion: 1});
send("streamlit:setFrameHeight", {height: 0});
</script>
</body></html>
