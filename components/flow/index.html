<!doctype html>
<html><head><meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:transparent;font-family:system-ui,sans-serif}
#wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
#wrap svg{width:100%;height:auto;display:block}
@media (max-width:640px){#wrap svg{min-width:660px}}
g.node{cursor:pointer}
g.node:hover path,g.node:hover polygon,g.node:hover ellipse{filter:brightness(1.35)}
g.node.sel path,g.node.sel polygon,g.node.sel ellipse{stroke:#f5c518;stroke-width:4.5px;filter:drop-shadow(0 0 7px rgba(245,197,24,.75))}
g.node.sel text{font-weight:700}
svg.has-sel g.node:not(.sel){opacity:.55}svg.has-sel g.node:not(.sel):hover{opacity:1}
#hint{color:#8b909c;font-size:12px;margin:2px 0 0}
g.plus{cursor:pointer;opacity:.75}g.plus:hover{opacity:1}
g.plus circle{fill:#f5d76e;stroke:#0e1117;stroke-width:1.5}
g.plus text{fill:#2a2410;font:700 12px system-ui,sans-serif;pointer-events:none}
g.play{cursor:pointer;opacity:.85}g.play:hover{opacity:1}g.play:hover circle{filter:brightness(1.2)}
g.play circle{fill:#2ec4b6;stroke:#0e1117;stroke-width:1.5}g.play path{fill:#08201d;pointer-events:none}
</style>
<script src="viz-standalone.js"></script>
</head>
<body>
<div id="wrap"></div><div id="hint">Tap a box to open it in the editor below · ▶ starts a timer on it · ＋ adds a note to it.</div>
<script>
// 🗺️ The roadmap flow chart, drawn with Graphviz (viz.js, MIT) and clickable: tapping a box sends its id back to
// the app, which opens that block / stage / goal for editing right under the chart.
const send = (type, extra) => window.parent.postMessage(Object.assign({isStreamlitMessage: true, type}, extra), "*");
let lastDot = null, lastSel = null, vizP = Viz.instance();
const height = () => send("streamlit:setFrameHeight", {height: document.body.scrollHeight + 4});
function mark(sel) {
  sel = (sel || "").replace(/^(add|play):/, "");
  const svg = document.querySelector("#wrap svg");
  if (svg) svg.classList.toggle("has-sel", !!sel);
  document.querySelectorAll("g.node").forEach(g => {
    const id = (g.querySelector("title") || {}).textContent;
    g.classList.toggle("sel", !!sel && id === sel);
  });
}
window.addEventListener("message", ev => {
  const d = ev.data || {};
  if (d.type !== "streamlit:render") return;
  const a = d.args || {};
  const plays = new Set(a.play || []);
  if (a.dot === lastDot) { if (a.sel !== lastSel) { lastSel = a.sel; mark(a.sel); } return; }
  lastDot = a.dot; lastSel = a.sel;
  vizP.then(viz => {
    const svg = viz.renderSVGElement(a.dot);
    svg.removeAttribute("width"); svg.removeAttribute("height");
    const w = document.getElementById("wrap"); w.innerHTML = ""; w.appendChild(svg);
    const NS = "http://www.w3.org/2000/svg";
    svg.querySelectorAll("g.node").forEach(g => {
      const id = (g.querySelector("title") || {}).textContent;
      g.addEventListener("click", () => {
        mark(id);
        send("streamlit:setComponentValue", {value: {id: id, t: Date.now()}, dataType: "json"});
      });
      if (id.startsWith("n_")) return;  // notes themselves don't get a ＋
      // ＋ badge on the box's top-right corner: a note pinned to this box, in one tap
      const shape = g.querySelector("path,polygon,ellipse"); if (!shape) return;
      const b = shape.getBBox(), p = document.createElementNS(NS, "g");
      p.setAttribute("class", "plus");
      p.setAttribute("transform", "translate(" + (b.x + b.width - 3) + "," + (b.y + 3) + ")");
      p.innerHTML = '<title>Add a note here</title><circle r="8"></circle><text text-anchor="middle" dy="4">+</text>';
      p.addEventListener("click", e => {
        e.stopPropagation(); mark(id);
        send("streamlit:setComponentValue", {value: {id: id, add: true, t: Date.now()}, dataType: "json"});
      });
      g.parentNode.appendChild(p);
      if (!plays.has(id)) return;
      // ▶ badge on the left edge of an open block (clear of its text): start a focus timer on it
      const q = document.createElementNS(NS, "g");
      q.setAttribute("class", "play");
      q.setAttribute("transform", "translate(" + (b.x - 5) + "," + (b.y + b.height / 2) + ")");
      q.innerHTML = '<title>Start a focus timer on it</title><circle r="10"></circle><path d="M-3,-5 L5,0 L-3,5 Z"></path>';
      q.addEventListener("click", e => {
        e.stopPropagation(); mark(id);
        send("streamlit:setComponentValue", {value: {id: id, play: true, t: Date.now()}, dataType: "json"});
      });
      g.parentNode.appendChild(q);
    });
    if (plays.size) {  // room for the ▶ badges that sit out past the left-most boxes
      const vb = (svg.getAttribute("viewBox") || "").split(/[ ,]+/).map(Number);
      if (vb.length === 4) svg.setAttribute("viewBox", [vb[0] - 18, vb[1], vb[2] + 18, vb[3]].join(" "));
    }
    mark(a.sel); height();
    setTimeout(height, 120);
  }).catch(e => { document.getElementById("wrap").textContent = "Couldn't draw the chart: " + e; height(); });
});
window.addEventListener("resize", height);
send("streamlit:componentReady", {apiVersion: 1});
</script>
</body></html>
